<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ملخصات 3 إعدادي | المنصة الرسمية</title>
    <!-- خط Cairo الاحترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent-exam: #ef4444;
            --accent-summary: #10b981;
            --accent-course: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----------------------------------------------------
           🔒 شاشة تسجيل الدخول الفخمة (Login Modal)
        ---------------------------------------------------- */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            transition: all 0.5s ease;
        }

        .login-box {
            background: linear-gradient(145deg, #162036, #0e1626);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--primary-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -60px;
            left: -60px;
            width: 150px;
            height: 150px;
            background: var(--primary);
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.5;
        }

        .login-box h2 {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(to left, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
        }

        /* ----------------------------------------------------
           🏛️ الهيدر والواجهة الرئيسية للمنصة
        ---------------------------------------------------- */
        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .user-welcome-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            padding: 0 10px;
        }

        .user-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            color: #60a5fa;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: white;
        }

        header h1 {
            font-size: 2.3rem;
            font-weight: 900;
            background: linear-gradient(to left, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* الفلاتر والمحتوى */
        .filters-container {
            max-width: 1200px;
            margin: 25px auto 15px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
            flex-grow: 1;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .badge {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        .badge.summary { background: rgba(16, 185, 129, 0.15); color: var(--accent-summary); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.exam { background: rgba(239, 68, 68, 0.15); color: var(--accent-exam); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge.course { background: rgba(139, 92, 246, 0.15); color: var(--accent-course); border: 1px solid rgba(139, 92, 246, 0.3); }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .btn-open {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .no-data {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: #080c14;
        }
    </style>
</head>
<body>

    <!-- 🔒 نافذة تسجيل الدخول -->
    <div class="login-overlay" id="loginModal">
        <div class="login-box">
            <h2>تسجيل الدخول للمنصة 🎓</h2>
            <p>أدخل بياناتك للوصول إلى الملخصات والامتحانات والكورسات</p>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>الاسم بالكامل:</label>
                    <input type="text" id="studentName" placeholder="مثال: علي شعبان" required>
                </div>
                <div class="input-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="studentPhone" placeholder="01xxxxxxxxx" pattern="[0-9]{11}" title="يرجى إدخال رقم هاتف صحيح مكون من 11 رقم" required>
                </div>
                <button type="submit" class="btn-login">دخول المنصة 🚀</button>
            </form>
        </div>
    </div>

    <!-- 🏛️ واجهة المنصة -->
    <header>
        <div class="user-welcome-bar">
            <div class="user-badge" id="welcomeText">مرحباً بك يا طالب 🎓</div>
            <button class="btn-logout" onclick="logout()">تغيير الحساب 🔄</button>
        </div>
        <h1>منصة ملخصات 3 إعدادي</h1>
        <p>المنصة الرسمية لمراجعة واستذكار جميع مواد الشهادة الإعدادية</p>
    </header>

    <!-- الفلاتر -->
    <div class="filters-container">
        <div class="filter-group" id="subject-filters">
            <button class="filter-btn active" onclick="filterData('subject', 'الكل')">📌 كل المواد</button>
            <button class="filter-btn" onclick="filterData('subject', 'دراسات اجتماعية')">🌍 دراسات اجتماعية</button>
            <button class="filter-btn" onclick="filterData('subject', 'علوم')">🧬 علوم</button>
            <button class="filter-btn" onclick="filterData('subject', 'لغة عربية')">📖 لغة عربية</button>
            <button class="filter-btn" onclick="filterData('subject', 'لغة إنجليزية')">🔤 لغة إنجليزية</button>
            <button class="filter-btn" onclick="filterData('subject', 'رياضيات')">➗ رياضيات</button>
        </div>

        <div class="filter-group" id="type-filters">
            <button class="filter-btn active" onclick="filterData('type', 'الكل')">⭐ كل الأنواع</button>
            <button class="filter-btn" onclick="filterData('type', 'ملخصات')">📚 ملخصات</button>
            <button class="filter-btn" onclick="filterData('type', 'امتحانات')">📝 امتحانات</button>
            <button class="filter-btn" onclick="filterData('type', 'كورسات ودروس')">🎥 كورسات ودروس</button>
        </div>
    </div>

    <!-- المحتوى -->
    <div class="container" id="content-container">
        <div class="no-data">⏳ جاري تحميل المحتوى التعليمي...</div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 | منصة ملخصات 3 إعدادي 🎓
    </footer>

    <script>
        let allData = [];
        let currentSubject = 'الكل';
        let currentType = 'الكل';

        // 🔐 التحكم في تسجيل الدخول
        function checkLoginStatus() {
            const savedName = localStorage.getItem('student_name');
            const savedPhone = localStorage.getItem('student_phone');

            if (savedName && savedPhone) {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('welcomeText').innerText = `مرحباً بك: ${savedName} 👋`;
                loadData();
            } else {
                document.getElementById('loginModal').style.display = 'flex';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const name = document.getElementById('studentName').value;
            const phone = document.getElementById('studentPhone').value;

            localStorage.setItem('student_name', name);
            localStorage.setItem('student_phone', phone);

            checkLoginStatus();
        }

        function logout() {
            localStorage.removeItem('student_name');
            localStorage.removeItem('student_phone');
            location.reload();
        }

        // 📡 جلب البيانات من GitHub data.json
        async function loadData() {
            const container = document.getElementById('content-container');
            try {
                const response = await fetch('data.json?' + new Date().getTime());
                if (!response.ok) throw new Error("لا توجد بيانات");
                
                allData = await response.json();
                renderData();

            } catch (error) {
                container.innerHTML = '<div class="no-data">📭 لا توجد مراجعات مضافة حالياً، استخدم البوت لإضافة أول درس!</div>';
            }
        }

        function filterData(category, value) {
            if (category === 'subject') {
                currentSubject = value;
                updateActiveButtons('subject-filters', value);
            } else if (category === 'type') {
                currentType = value;
                updateActiveButtons('type-filters', value);
            }
            renderData();
        }

        function updateActiveButtons(containerId, activeValue) {
            const container = document.getElementById(containerId);
            const buttons = container.getElementsByClassName('filter-btn');
            for (let btn of buttons) {
                if (btn.innerText.includes(activeValue) || (activeValue === 'الكل' && btn.innerText.includes('كل'))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        }

        function renderData() {
            const container = document.getElementById('content-container');
            
            let filtered = allData.filter(item => {
                let matchSubject = (currentSubject === 'الكل' || item.subject === currentSubject);
                let matchType = (currentType === 'الكل' || item.type === currentType);
                return matchSubject && matchType;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">🔍 لا توجد نتائج مطابقة لهذا الاختيار حالياً.</div>';
                return;
            }

            container.innerHTML = '';

            filtered.forEach(item => {
                let badgeClass = 'summary';
                if (item.type.includes('امتحان')) badgeClass = 'exam';
                if (item.type.includes('كورس')) badgeClass = 'course';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge ${badgeClass}">${item.type}</span>
                            <span style="color: var(--text-muted); font-size: 0.9rem;">📌 ${item.subject}</span>
                        </div>
                        <div class="card-title">مراجعة شاملة لمادة ${item.subject}</div>
                    </div>
                    <a href="${item.link}" target="_blank" class="btn-open">فتح المحتوى الآن 🚀</a>
                `;
                container.appendChild(card);
            });
        }

        // بدء الفحص عند تحميل الصفحة
        checkLoginStatus();
    </script>
</body>
</html>
