<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ملخصات 3 إعدادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #020617; }</style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
        <div class="text-center mb-8">
            <span class="bg-sky-500/10 text-sky-400 px-4 py-1.5 rounded-full text-xs font-bold">منصة أبطال 3 إعدادي</span>
            <h1 class="text-2xl font-black mt-3">تسجيل دخول الطالب</h1>
            <p class="text-xs text-slate-400 mt-1">أدخل بياناتك لفتح التطبيق (لأول مرة فقط)</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">اسم الطالب الثلاثي *</label>
                <input type="text" id="login-name" placeholder="اكتب اسمك هنا..." class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">رقم الهاتف / الواتساب *</label>
                <input type="text" id="login-phone" placeholder="مثال: 010xxxxxxxx" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-sm focus:outline-none focus:border-sky-500">
            </div>

            <button onclick="loginUser()" class="w-full py-4 bg-sky-600 hover:bg-sky-500 rounded-2xl font-bold text-sm shadow-xl shadow-sky-500/20 transition">
                دخول المنصة 🚀
            </button>
        </div>
    </div>

    <script>
        // ضع توكن بوت تيليجرام الخاص بتسجيل الدخول والـ Chat ID هنا
        const LOGIN_BOT_TOKEN = "YOUR_LOGIN_BOT_TOKEN";
        const LOGIN_CHAT_ID = "YOUR_LOGIN_CHAT_ID";

        async function loginUser() {
            let name = document.getElementById("login-name").value.trim();
            let phone = document.getElementById("login-phone").value.trim();

            if(!name || !phone) {
                alert("يرجى إدخال الاسم ورقم الهاتف!");
                return;
            }

            // حفظ بيانات الطالب في ذاكرة الموبايل
            localStorage.setItem("student_name", name);
            localStorage.setItem("student_phone", phone);

            // إرسال بيانات الدخول لبوت التيليجرام
            try {
                await fetch(`https://api.telegram.org/bot${LOGIN_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: LOGIN_CHAT_ID,
                        text: `🔔 *طالب جديد سجل دخوله للتطبيق!*\n\n👤 *الاسم:* ${name}\n📱 *الهاتف:* ${phone}`,
                        parse_mode: "Markdown"
                    })
                });
            } catch(e) { console.error(e); }

            // التحويل للرئيسية
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
