<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ملخصات 3 إعدادي - تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background-color: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-header h1 {
            color: #4facfe;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: #ccc;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #4facfe;
            outline: none;
            box-shadow: 0 0 5px rgba(79, 172, 254, 0.3);
        }

        .login-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #121212;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>🎓 منصة 3 إعدادي</h1>
            <p>سجل دخولك للوصول إلى الملخصات والامتحانات</p>
        </div>
        
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">اسم الطالب أو البريد:</label>
                <input type="text" id="username" placeholder="اكتب اسمك هنا..." required>
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور / كود الدخول:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">دخول للمنصة</button>
        </form>

        <div class="footer-note">
            جميع الحقوق محفوظة للمنصة التعليمية © 2026
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            if(username.trim()) {
                alert('أهلاً بك يا ' + username + '! جاري توجيهك إلى لوحة التحكم...');
                // يتم تحويل الطالب لملف index.html بعد تسجيل الدخول
                window.location.href = 'index.html';
            }
        }
    </script>

</body>
</html>
