<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ملخصات 3 إعدادي - البوابة الرئيسية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e1e2f 0%, #0b0b13 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            filter: blur(120px);
            opacity: 0.15;
            top: 10%;
            left: 20%;
            z-index: -1;
        }

        .login-card {
            background: rgba(26, 26, 36, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 45px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 22px;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 15, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00f2fe;
            outline: none;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(20, 20, 30, 0.9);
        }

        .login-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b0b13;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>🎓 ملخصات 3 إعدادي</h1>
            <p>سجل دخولك لتنطلق في عالم التفوق والدروس</p>
        </div>
        
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">اسم الطالب:</label>
                <input type="text" id="username" placeholder="اكتب اسمك الثلاثي..." required>
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">دخول المنصة 🚀</button>
        </form>

        <div class="footer-note">
            جميع الحقوق محفوظة للمنصة التعليمية © 2026
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            if(username.trim()) {
                localStorage.setItem('student_name', username);
                window.location.href = 'index.html';
            }
        }
    </script>

</body>
</html>
